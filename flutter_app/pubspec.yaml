name: earpro_smart_music_player
description: "Earpro - Smart Music Player Flutter App with Auto Voice Detection & 10s Auto-Resume"
publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  record: ^5.1.2
  permission_handler: ^11.3.1
  file_picker: ^8.0.0
  on_audio_query: ^2.9.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
