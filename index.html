<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Earpro" />
    <link rel="icon" type="image/jpeg" href="/src/assets/images/music_app_icon_1785345989179.jpg" />
    <link rel="apple-touch-icon" href="/src/assets/images/music_app_icon_1785345989179.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Earpro — Smart Music Player PWA</title>
  </head>
  <body class="bg-[#121212] text-white selection:bg-emerald-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
